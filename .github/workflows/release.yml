name: Release

# A tag v1.2.3 builds the desktop app for macOS, Linux and Windows and publishes it as a GitHub release, with
# SHA256SUMS for the install scripts. A pull request that changes the release builds the same files without
# publishing them, and so does running the workflow by hand.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/**
      - scripts/install.*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The release talks to the hosted Tresso until the user picks their own server at sign-in.
  VITE_API_URL: https://api.tresso.app
  VITE_OAUTH_CLIENT_ID: web
  VITE_DESKTOP_OAUTH_CLIENT_ID: desktop
  VITE_NATIVE_REDIRECT_URI: tresso://auth/callback

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Builds that are not published get 0.0.0: Windows Installer only takes numeric versions.
          if [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0"
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "The tag ${REF_NAME} is not v<major>.<minor>.<patch>[-<pre>]." >&2
            exit 1
          fi
          prerelease=false
          [[ "${version}" == *-* ]] && prerelease=true
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "Building ${version} (prerelease: ${prerelease})"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          # No Apple Developer ID yet: an ad-hoc signature, so Apple Silicon runs the app once the quarantine is lifted.
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          set -euo pipefail
          # Windows Installer only takes numeric versions, so a prerelease ships the setup.exe alone.
          if [ "${PRERELEASE}" = "true" ]; then
            BUNDLES="${BUNDLES//,msi/}"
          fi
          npx tauri build --target "${TARGET}" --bundles "${BUNDLES}" --config "{\"version\":\"${VERSION}\"}"

      - name: Collect files
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="apps/desktop/src-tauri/target/${TARGET}/release/bundle"
          mkdir -p dist
          one() {
            local found=("$@")
            if [ "${#found[@]}" -ne 1 ] || [ ! -e "${found[0]}" ]; then
              echo "Expected one file, found: ${found[*]}" >&2
              ls -R "${bundle}" >&2
              exit 1
            fi
            printf '%s' "${found[0]}"
          }
          shopt -s nullglob
          case "${NAME}" in
            macos-*)
              cp "$(one "${bundle}"/dmg/*.dmg)" "dist/tresso-${NAME}.dmg"
              export COPYFILE_DISABLE=1
              tar -czf "dist/tresso-${NAME}.app.tar.gz" -C "${bundle}/macos" Tresso.app
              ;;
            linux-*)
              cp "$(one "${bundle}"/appimage/*.AppImage)" "dist/tresso-${NAME}.AppImage"
              cp "$(one "${bundle}"/deb/*.deb)" "dist/tresso-${NAME}.deb"
              ;;
            windows-*)
              cp "$(one "${bundle}"/nsis/*-setup.exe)" "dist/tresso-${NAME}-setup.exe"
              msi=("${bundle}"/msi/*.msi)
              if [ "${#msi[@]}" -gt 0 ]; then
                cp "$(one "${msi[@]}")" "dist/tresso-${NAME}.msi"
              fi
              ;;
          esac
          ls -la dist

      # install.ps1 runs the setup silently and then looks for the app where it should land; check that it does.
      - name: Install silently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/tresso-windows-x64-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the setup stopped with exit code $($process.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Tresso\tresso-desktop.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse (Join-Path $env:LOCALAPPDATA 'Tresso') -ErrorAction SilentlyContinue | Format-Table FullName
            throw "the setup did not install $exe"
          }
          $scheme = Get-ItemProperty -Path 'HKCU:\Software\Classes\tresso\shell\open\command' -ErrorAction SilentlyContinue
          if ($null -eq $scheme) { throw 'the setup did not register tresso:// links' }
          Write-Output "Installed $exe; tresso:// opens $($scheme.'(default)')"

      - uses: actions/upload-artifact@v4
        with:
          name: tresso-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [version, build]
    # Only a pushed tag publishes; running the workflow by hand on a tag builds without publishing too.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd artifacts
          expected=(
            tresso-macos-universal.dmg
            tresso-macos-universal.app.tar.gz
            tresso-linux-x86_64.AppImage
            tresso-linux-x86_64.deb
            tresso-linux-aarch64.AppImage
            tresso-linux-aarch64.deb
            tresso-windows-x64-setup.exe
          )
          if [ "${PRERELEASE}" != "true" ]; then
            expected+=(tresso-windows-x64.msi)
          fi
          for name in "${expected[@]}"; do
            if [ ! -f "${name}" ]; then
              echo "Missing release file: ${name}" >&2
              ls -la
              exit 1
            fi
          done
          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Tresso ${{ github.ref_name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/tresso-*
            artifacts/SHA256SUMS
            scripts/install.sh
            scripts/install.ps1
