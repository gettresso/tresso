name: Release

# A tag v1.2.3 builds the desktop app for macOS, Linux and Windows and publishes it as a GitHub release, with
# SHA256SUMS for the install scripts. A pull request that changes the release builds the same files without
# publishing them, and so does running the workflow by hand.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/**
      - scripts/install.*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The release talks to the hosted Tresso until the user picks their own server at sign-in.
  VITE_API_URL: https://api.tresso.app
  VITE_OAUTH_CLIENT_ID: web
  VITE_DESKTOP_OAUTH_CLIENT_ID: desktop
  VITE_NATIVE_REDIRECT_URI: tresso://auth/callback

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      # Sparkle compares CFBundleVersion and cannot order 0.3.0-beta.1 before 0.3.0, so macOS builds carry this run's
      # number there instead: it only ever goes up. The version users see stays the tag's.
      build: ${{ github.run_number }}
    steps:
      - id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Builds that are not published get 0.0.0: Windows Installer only takes numeric versions.
          if [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0"
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "The tag ${REF_NAME} is not v<major>.<minor>.<patch>[-<pre>]." >&2
            exit 1
          fi
          prerelease=false
          [[ "${version}" == *-* ]] && prerelease=true
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "Building ${version} (prerelease: ${prerelease})"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Everything that compiles (the web client with its npm packages, the Rust crates) runs without the signing keys.
      - name: Build
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          TARGET: ${{ matrix.target }}
          RUNNER: ${{ runner.os }}
        run: |
          set -euo pipefail
          config="{\"version\":\"${VERSION}\"}"
          if [ "${RUNNER}" = "macOS" ]; then
            config="{\"version\":\"${VERSION}\",\"bundle\":{\"macOS\":{\"bundleVersion\":\"${BUILD}\"}}}"
          fi
          echo "TAURI_CONFIG_OVERRIDE=${config}" >> "${GITHUB_ENV}"
          npx tauri build --no-bundle --target "${TARGET}" --config "${config}"

      - name: Bundle
        shell: bash
        working-directory: apps/desktop
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          # No Apple Developer ID yet: an ad-hoc signature, so Apple Silicon runs the app once the quarantine is lifted.
          APPLE_SIGNING_IDENTITY: '-'
          # Tauri skips the Finder layout of the DMG (background, icon positions) on CI unless told otherwise.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: |
          set -euo pipefail
          # Windows Installer only takes numeric versions, so a prerelease ships the setup.exe alone.
          if [ "${PRERELEASE}" = "true" ]; then
            BUNDLES="${BUNDLES//,msi/}"
          fi
          npx tauri bundle --target "${TARGET}" --bundles "${BUNDLES}" --config "${TAURI_CONFIG_OVERRIDE}"

      - name: Collect files
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          bundle="apps/desktop/src-tauri/target/${TARGET}/release/bundle"
          mkdir -p dist
          one() {
            local found=("$@")
            if [ "${#found[@]}" -ne 1 ] || [ ! -e "${found[0]}" ]; then
              echo "Expected one file, found: ${found[*]}" >&2
              ls -R "${bundle}" >&2
              exit 1
            fi
            printf '%s' "${found[0]}"
          }
          shopt -s nullglob
          case "${NAME}" in
            macos-*)
              cp "$(one "${bundle}"/dmg/*.dmg)" "dist/tresso-${NAME}.dmg"
              # The DMG must carry its Finder layout: the background and the window settings in .DS_Store.
              mount="$(mktemp -d)"
              hdiutil attach -nobrowse -readonly -mountpoint "${mount}" "dist/tresso-${NAME}.dmg" >/dev/null
              status=0
              for file in .background/background.tiff .DS_Store Tresso.app Applications; do
                if [ ! -e "${mount}/${file}" ]; then
                  echo "The DMG has no ${file}" >&2
                  status=1
                fi
              done
              # Spotlight sometimes still holds the new volume for a moment.
              hdiutil detach "${mount}" >/dev/null || hdiutil detach -force "${mount}" >/dev/null
              [ "${status}" -eq 0 ] || exit 1
              # Sparkle is what updates the app, so a bundle without it would never update again.
              if [ ! -x "${bundle}/macos/Tresso.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate" ]; then
                echo "Tresso.app has no Sparkle.framework" >&2
                exit 1
              fi
              export COPYFILE_DISABLE=1
              tar -czf "dist/tresso-${NAME}.app.tar.gz" -C "${bundle}/macos" Tresso.app
              # Sparkle's EdDSA signature of the archive, for the appcast the release job writes.
              if [ -n "${SPARKLE_PRIVATE_KEY}" ]; then
                key="$(mktemp)"
                trap 'rm -f "${key}"' EXIT
                printf '%s' "${SPARKLE_PRIVATE_KEY}" > "${key}"
                apps/desktop/.sparkle/bin/sign_update --ed-key-file "${key}" "dist/tresso-${NAME}.app.tar.gz" > "dist/tresso-${NAME}.app.tar.gz.sparkle"
                cat "dist/tresso-${NAME}.app.tar.gz.sparkle"
              elif [ "${TAG}" = "true" ]; then
                echo "A release needs SPARKLE_PRIVATE_KEY to sign its update." >&2
                exit 1
              fi
              ;;
            linux-*)
              cp "$(one "${bundle}"/appimage/*.AppImage)" "dist/tresso-${NAME}.AppImage"
              cp "$(one "${bundle}"/deb/*.deb)" "dist/tresso-${NAME}.deb"
              ;;
            windows-*)
              cp "$(one "${bundle}"/nsis/*-setup.exe)" "dist/tresso-${NAME}-setup.exe"
              msi=("${bundle}"/msi/*.msi)
              if [ "${#msi[@]}" -gt 0 ]; then
                cp "$(one "${msi[@]}")" "dist/tresso-${NAME}.msi"
              fi
              ;;
          esac
          ls -la dist

      # Tauri's updater (Windows, Linux) installs only files signed with this key; the app trusts its public half in
      # tauri.conf.json. Signed in a step of its own, so no bundling tool ever sees the key. A pull request from a fork
      # has no secrets and skips it; a release never does.
      - name: Sign updates (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        working-directory: apps/desktop
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_type == 'tag' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            if [ "${TAG}" = "true" ]; then
              echo "A release needs TAURI_SIGNING_PRIVATE_KEY to sign its updates." >&2
              exit 1
            fi
            echo "No signing key here (a pull request from a fork): the updates stay unsigned."
            exit 0
          fi
          case "${NAME}" in
            linux-*) file="../../dist/tresso-${NAME}.AppImage" ;;
            windows-*) file="../../dist/tresso-${NAME}-setup.exe" ;;
          esac
          # The version goes into the signature, and the app (requireSignedVersion) installs a file only as that version.
          npx tauri signer sign --app-version "${VERSION}" "${file}" > /dev/null
          test -s "${file}.sig"
          ls -la "${file}.sig"

      # install.ps1 runs the setup silently and then looks for the app where it should land; check that it does.
      - name: Install silently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/tresso-windows-x64-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the setup stopped with exit code $($process.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Tresso\tresso-desktop.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse (Join-Path $env:LOCALAPPDATA 'Tresso') -ErrorAction SilentlyContinue | Format-Table FullName
            throw "the setup did not install $exe"
          }
          $scheme = Get-ItemProperty -Path 'HKCU:\Software\Classes\tresso\shell\open\command' -ErrorAction SilentlyContinue
          if ($null -eq $scheme) { throw 'the setup did not register tresso:// links' }
          Write-Output "Installed $exe; tresso:// opens $($scheme.'(default)')"

      - uses: actions/upload-artifact@v4
        with:
          name: tresso-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [version, build]
    # Only a pushed tag publishes; running the workflow by hand on a tag builds without publishing too.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd artifacts
          expected=(
            tresso-macos-universal.dmg
            tresso-macos-universal.app.tar.gz
            tresso-linux-x86_64.AppImage
            tresso-linux-x86_64.deb
            tresso-linux-aarch64.AppImage
            tresso-linux-aarch64.deb
            tresso-windows-x64-setup.exe
          )
          if [ "${PRERELEASE}" != "true" ]; then
            expected+=(tresso-windows-x64.msi)
          fi
          for name in "${expected[@]}"; do
            if [ ! -f "${name}" ]; then
              echo "Missing release file: ${name}" >&2
              ls -la
              exit 1
            fi
          done
          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS

      # The feeds the installed apps read at releases/latest/download: Sparkle's appcast (macOS) and Tauri's latest.json
      # (Windows, Linux). A prerelease is never "latest", so it reaches no one who did not ask for it.
      - name: Write update feeds
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          for name in tresso-macos-universal.app.tar.gz.sparkle tresso-linux-x86_64.AppImage.sig tresso-linux-aarch64.AppImage.sig tresso-windows-x64-setup.exe.sig; do
            if [ ! -s "${name}" ]; then
              echo "Missing update signature: ${name}" >&2
              exit 1
            fi
          done
          gh api "repos/${REPO}/releases/generate-notes" -f tag_name="${TAG}" --jq .body > notes.md
          python3 - <<'PY'
          import datetime, email.utils, json, os, re
          from xml.sax.saxutils import escape, quoteattr

          version, build, tag, repo = os.environ["VERSION"], os.environ["BUILD"], os.environ["TAG"], os.environ["REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          page = f"https://github.com/{repo}/releases/tag/{tag}"
          notes = open("notes.md").read().strip()
          now = datetime.datetime.now(datetime.timezone.utc)

          def sig(name):
              return open(name).read().strip()

          latest = {
              "version": version,
              "notes": notes,
              "pub_date": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "linux-x86_64": {"signature": sig("tresso-linux-x86_64.AppImage.sig"), "url": f"{base}/tresso-linux-x86_64.AppImage"},
                  "linux-aarch64": {"signature": sig("tresso-linux-aarch64.AppImage.sig"), "url": f"{base}/tresso-linux-aarch64.AppImage"},
                  "windows-x86_64": {"signature": sig("tresso-windows-x64-setup.exe.sig"), "url": f"{base}/tresso-windows-x64-setup.exe"},
              },
          }
          open("latest.json", "w").write(json.dumps(latest, indent=2) + "\n")

          # sign_update prints: sparkle:edSignature="..." length="..."
          sparkle = sig("tresso-macos-universal.app.tar.gz.sparkle")
          signature = re.search(r'sparkle:edSignature="([^"]+)"', sparkle).group(1)
          length = re.search(r'length="(\d+)"', sparkle).group(1)
          appcast = f"""<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Tresso</title>
              <link>{escape(page)}</link>
              <item>
                <title>Tresso {escape(version)}</title>
                <pubDate>{email.utils.format_datetime(now)}</pubDate>
                <sparkle:version>{escape(build)}</sparkle:version>
                <sparkle:shortVersionString>{escape(version)}</sparkle:shortVersionString>
                <sparkle:fullReleaseNotesLink>{escape(page)}</sparkle:fullReleaseNotesLink>
                <description><![CDATA[<pre style="font: 13px -apple-system, sans-serif; white-space: pre-wrap">{escape(notes)}</pre>]]></description>
                <enclosure url={quoteattr(base + "/tresso-macos-universal.app.tar.gz")} sparkle:edSignature={quoteattr(signature)} length={quoteattr(length)} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          """
          open("appcast.xml", "w").write(appcast)
          PY
          rm tresso-macos-universal.app.tar.gz.sparkle notes.md
          cat latest.json appcast.xml

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Tresso ${{ github.ref_name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/tresso-*
            artifacts/SHA256SUMS
            artifacts/latest.json
            artifacts/appcast.xml
            scripts/install.sh
            scripts/install.ps1
