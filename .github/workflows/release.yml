name: Release

# A tag v1.2.3 builds the desktop app for macOS, Linux and Windows and publishes it as a GitHub release, with
# SHA256SUMS for the install scripts, and publishes the server images (API, sync worker, web client) for amd64 and
# arm64 on ghcr.io. A pull request that changes the release builds the same files and images without publishing
# them, and so does running the workflow by hand.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/**
      - scripts/**
      - docker/**
      - .dockerignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The release talks to the hosted Tresso until the user picks their own server at sign-in.
  VITE_API_URL: https://api.tresso.app
  VITE_OAUTH_CLIENT_ID: web
  VITE_DESKTOP_OAUTH_CLIENT_ID: desktop
  VITE_NATIVE_REDIRECT_URI: tresso://auth/callback

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      # Sparkle compares CFBundleVersion and cannot order 0.3.0-beta.1 before 0.3.0, so macOS builds carry this run's
      # number there instead: it only ever goes up. The version users see stays the tag's.
      build: ${{ github.run_number }}
    steps:
      - id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Builds that are not published get 0.0.0: Windows Installer only takes numeric versions.
          if [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0"
          fi
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "The tag ${REF_NAME} is not v<major>.<minor>.<patch>[-<pre>]." >&2
            exit 1
          fi
          prerelease=false
          [[ "${version}" == *-* ]] && prerelease=true
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "Building ${version} (prerelease: ${prerelease})"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Everything that compiles (the web client with its npm packages, the Rust crates) runs without the signing keys.
      - name: Build
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          TARGET: ${{ matrix.target }}
          RUNNER: ${{ runner.os }}
        run: |
          set -euo pipefail
          config="{\"version\":\"${VERSION}\"}"
          if [ "${RUNNER}" = "macOS" ]; then
            config="{\"version\":\"${VERSION}\",\"bundle\":{\"macOS\":{\"bundleVersion\":\"${BUILD}\"}}}"
          fi
          echo "TAURI_CONFIG_OVERRIDE=${config}" >> "${GITHUB_ENV}"
          npx tauri build --no-bundle --target "${TARGET}" --config "${config}"

      - name: Bundle
        shell: bash
        working-directory: apps/desktop
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          # No Apple Developer ID yet: an ad-hoc signature, so Apple Silicon runs the app once the quarantine is lifted.
          APPLE_SIGNING_IDENTITY: '-'
          # Tauri skips the Finder layout of the DMG (background, icon positions) on CI unless told otherwise.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: |
          set -euo pipefail
          # Windows Installer only takes numeric versions, so a prerelease ships the setup.exe alone.
          if [ "${PRERELEASE}" = "true" ]; then
            BUNDLES="${BUNDLES//,msi/}"
          fi
          npx tauri bundle --target "${TARGET}" --bundles "${BUNDLES}" --config "${TAURI_CONFIG_OVERRIDE}"

      - name: Collect files
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          bundle="apps/desktop/src-tauri/target/${TARGET}/release/bundle"
          mkdir -p dist
          one() {
            local found=("$@")
            if [ "${#found[@]}" -ne 1 ] || [ ! -e "${found[0]}" ]; then
              echo "Expected one file, found: ${found[*]}" >&2
              ls -R "${bundle}" >&2
              exit 1
            fi
            printf '%s' "${found[0]}"
          }
          shopt -s nullglob
          case "${NAME}" in
            macos-*)
              cp "$(one "${bundle}"/dmg/*.dmg)" "dist/tresso-${NAME}.dmg"
              # The DMG must carry its Finder layout: the background and the window settings in .DS_Store.
              mount="$(mktemp -d)"
              hdiutil attach -nobrowse -readonly -mountpoint "${mount}" "dist/tresso-${NAME}.dmg" >/dev/null
              status=0
              for file in .background/background.tiff .DS_Store Tresso.app Applications; do
                if [ ! -e "${mount}/${file}" ]; then
                  echo "The DMG has no ${file}" >&2
                  status=1
                fi
              done
              # Spotlight sometimes still holds the new volume for a moment.
              hdiutil detach "${mount}" >/dev/null || hdiutil detach -force "${mount}" >/dev/null
              [ "${status}" -eq 0 ] || exit 1
              # Sparkle is what updates the app, so a bundle without it would never update again.
              app="${bundle}/macos/Tresso.app"
              if [ ! -x "${app}/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate" ]; then
                echo "Tresso.app has no Sparkle.framework" >&2
                exit 1
              fi
              # The app runs with the hardened runtime, and loads the ad-hoc signed Sparkle.framework only because
              # library validation is off (src-tauri/Entitlements.plist). Without either, it would not start or not
              # update.
              codesign --verify --deep --strict "${app}"
              flags="$(codesign --display --verbose "${app}" 2>&1 | sed -n 's/^CodeDirectory.*flags=\(0x[0-9a-f]*\)(\([^)]*\)).*/\2/p')"
              case ",${flags}," in
                *,runtime,*) ;;
                *) echo "Tresso.app is not signed with the hardened runtime (flags: ${flags})" >&2; exit 1 ;;
              esac
              entitlements="$(codesign --display --entitlements - --xml "${app}" 2>/dev/null)"
              if ! printf '%s' "${entitlements}" | grep -q 'com.apple.security.cs.disable-library-validation'; then
                echo "Tresso.app lacks the entitlement that lets it load Sparkle.framework" >&2
                exit 1
              fi
              export COPYFILE_DISABLE=1
              tar -czf "dist/tresso-${NAME}.app.tar.gz" -C "${bundle}/macos" Tresso.app
              # Sparkle's EdDSA signature of the archive, for the appcast the release job writes, checked right away.
              # The key goes in on stdin, never to disk.
              if [ -n "${SPARKLE_PRIVATE_KEY}" ]; then
                archive="dist/tresso-${NAME}.app.tar.gz"
                tools=apps/desktop/.sparkle/bin
                printf '%s' "${SPARKLE_PRIVATE_KEY}" | "${tools}/sign_update" --ed-key-file - "${archive}" > "${archive}.sparkle"
                signature="$(sed -nE 's/.*sparkle:edSignature="([^"]+)".*/\1/p' "${archive}.sparkle")"
                printf '%s' "${SPARKLE_PRIVATE_KEY}" | "${tools}/sign_update" --verify --ed-key-file - "${archive}" "${signature}"
                cat "${archive}.sparkle"
              elif [ "${TAG}" = "true" ]; then
                echo "A release needs SPARKLE_PRIVATE_KEY to sign its update." >&2
                exit 1
              fi
              ;;
            linux-*)
              cp "$(one "${bundle}"/appimage/*.AppImage)" "dist/tresso-${NAME}.AppImage"
              cp "$(one "${bundle}"/deb/*.deb)" "dist/tresso-${NAME}.deb"
              ;;
            windows-*)
              cp "$(one "${bundle}"/nsis/*-setup.exe)" "dist/tresso-${NAME}-setup.exe"
              msi=("${bundle}"/msi/*.msi)
              if [ "${#msi[@]}" -gt 0 ]; then
                cp "$(one "${msi[@]}")" "dist/tresso-${NAME}.msi"
              fi
              ;;
          esac
          ls -la dist

      # Tauri's updater (Windows, Linux) installs only files signed with this key; the app trusts its public half in
      # tauri.conf.json. Signed in a step of its own, so no bundling tool ever sees the key. A pull request from a fork
      # has no secrets and skips it; a release never does.
      - name: Sign updates (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        working-directory: apps/desktop
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_type == 'tag' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            if [ "${TAG}" = "true" ]; then
              echo "A release needs TAURI_SIGNING_PRIVATE_KEY to sign its updates." >&2
              exit 1
            fi
            echo "No signing key here (a pull request from a fork): the updates stay unsigned."
            exit 0
          fi
          case "${NAME}" in
            linux-*) file="../../dist/tresso-${NAME}.AppImage" ;;
            windows-*) file="../../dist/tresso-${NAME}-setup.exe" ;;
          esac
          # The version goes into the signature, and the app (requireSignedVersion) installs a file only as that version.
          npx tauri signer sign --app-version "${VERSION}" "${file}" > /dev/null
          test -s "${file}.sig"
          # The trusted comment must carry the version (scripts/update-feeds.mjs checks it again).
          tab="$(printf '\t')"
          trusted="$(base64 -d < "${file}.sig" | sed -n 's/^trusted comment: //p')"
          case "${tab}${trusted}${tab}" in
            *"${tab}version:${VERSION}${tab}"*) ;;
            *) echo "The signature of ${file} does not carry version ${VERSION}: ${trusted}" >&2; exit 1 ;;
          esac
          ls -la "${file}.sig"

      # install.ps1 runs the setup silently and then looks for the app where it should land; check that it does.
      - name: Install silently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/tresso-windows-x64-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the setup stopped with exit code $($process.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Tresso\tresso-desktop.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse (Join-Path $env:LOCALAPPDATA 'Tresso') -ErrorAction SilentlyContinue | Format-Table FullName
            throw "the setup did not install $exe"
          }
          $scheme = Get-ItemProperty -Path 'HKCU:\Software\Classes\tresso\shell\open\command' -ErrorAction SilentlyContinue
          if ($null -eq $scheme) { throw 'the setup did not register tresso:// links' }
          Write-Output "Installed $exe; tresso:// opens $($scheme.'(default)')"

      - uses: actions/upload-artifact@v4
        with:
          name: tresso-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  images:
    name: Image ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [tresso-api, tresso-sync, tresso-web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
          - image: tresso-api
            dockerfile: docker/api/Dockerfile
          - image: tresso-sync
            dockerfile: docker/sync/Dockerfile
          - image: tresso-web
            dockerfile: docker/web/Dockerfile
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture builds natively and is pushed by digest only; the manifest job below names them together.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: prod
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name=ghcr.io/{0}/{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, matrix.image) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Keep the digest
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifests:
    name: Publish image ${{ matrix.image }}
    needs: [version, images]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [tresso-api, tresso-sync, tresso-web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the exact version here; 1.2 and latest move once the release is published (image-latest below).
      - name: Name the image for both architectures
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          sources=()
          for digest in digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "${digest}")")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected an amd64 and an arm64 image of ${IMAGE}, found ${#sources[@]}." >&2
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only" \
            --annotation "index:org.opencontainers.image.description=Tresso ${{ matrix.image }}" \
            -t "${IMAGE}:${VERSION}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  release:
    name: Publish release
    needs: [version, build, image-manifests]
    # Only a pushed tag publishes; running the workflow by hand on a tag builds without publishing too.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The commits since the previous tag make the release notes (a full clone has every tag).
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tresso-*
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/install.ps1 artifacts/
          cd artifacts
          expected=(
            tresso-macos-universal.dmg
            tresso-macos-universal.app.tar.gz
            tresso-linux-x86_64.AppImage
            tresso-linux-x86_64.deb
            tresso-linux-aarch64.AppImage
            tresso-linux-aarch64.deb
            tresso-windows-x64-setup.exe
          )
          if [ "${PRERELEASE}" != "true" ]; then
            expected+=(tresso-windows-x64.msi)
          fi
          for name in "${expected[@]}"; do
            if [ ! -f "${name}" ]; then
              echo "Missing release file: ${name}" >&2
              ls -la
              exit 1
            fi
          done
          sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS

      # A draft first, with every file but the update feeds. The installed apps read the feeds at
      # releases/latest/download, so the release reaches them only once it is published with its feeds, below. A rerun
      # after a partial upload replaces the files (the notes stay as first written). A rerun after the release went out
      # stops here, so a published release never changes; image-latest then waits for this job and is skipped too, and
      # moves the image tags only on a successful run.
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # What's new since the previous release, from the commit subjects. A prerelease counts from the previous tag
          # of any kind, a release from the previous release, so its notes cover its betas too.
          if [ "${PRERELEASE}" = "true" ]; then
            previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          else
            previous="$(git tag --list 'v*' --merged "${TAG}^" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          fi
          range="${previous:+${previous}..}${TAG}"
          git log --format=%s "${range}" | node scripts/release-notes.mjs > notes.md
          cat >> notes.md <<'EOF'

          ## Install

          macOS and Linux:

          ```bash
          curl -fsSL https://sherin.dev/tresso/install.sh | bash
          ```

          Windows (PowerShell):

          ```powershell
          powershell -c "irm https://sherin.dev/tresso/install.ps1|iex"
          ```

          Or download an installer below. Every file is listed in `SHA256SUMS`. The macOS app is not notarized yet: after
          opening the `.dmg`, use **System Settings > Privacy & Security > Open Anyway** once.
          EOF
          cat notes.md
          # Exactly SHA256SUMS, the files it lists, their updater signatures and the install scripts. The Sparkle
          # signature only feeds the appcast; anything else here is a mistake.
          files=(artifacts/SHA256SUMS artifacts/install.sh artifacts/install.ps1)
          while read -r _ name; do
            name="${name#\*}"
            files+=("artifacts/${name}")
            if [ -f "artifacts/${name}.sig" ]; then
              files+=("artifacts/${name}.sig")
            fi
          done < artifacts/SHA256SUMS
          for file in artifacts/*; do
            case " ${files[*]} " in *" ${file} "*) continue ;; esac
            case "${file}" in
              *.sparkle) ;;
              *)
                echo "Unexpected file, not a release file: ${file}" >&2
                exit 1
                ;;
            esac
          done
          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "${TAG} is already published; a rerun does not replace its files." >&2
              exit 1
            fi
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            flags=(--draft --verify-tag --title "Tresso ${TAG}" --notes-file notes.md)
            if [ "${PRERELEASE}" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "${TAG}" "${files[@]}" "${flags[@]}"
          fi

      # The feeds the installed apps read: Sparkle's appcast (macOS) and Tauri's latest.json (Windows, Linux), with the
      # release notes without the install section, as HTML for Sparkle and as Markdown for the update card. Then the
      # release and its feeds go live together. A prerelease is never "latest", so it reaches no one who did not ask.
      - name: Publish the update feeds and the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUILD: ${{ needs.version.outputs.build }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --json body --jq .body > body.md
          awk 'BEGIN { skip = 0 } /^## Install/ { skip = 1; next } /^## / { skip = 0 } !skip' body.md > update-notes.md
          gh api markdown -f text="$(cat update-notes.md)" -f mode=gfm -f context="${GITHUB_REPOSITORY}" > update-notes.html
          node scripts/update-feeds.mjs artifacts "${TAG}" "${BUILD}" update-notes.md update-notes.html
          cat artifacts/latest.json artifacts/appcast.xml
          gh release upload "${TAG}" artifacts/latest.json artifacts/appcast.xml --clobber
          if [ "${PRERELEASE}" = "true" ]; then
            gh release edit "${TAG}" --draft=false --prerelease --latest=false
          else
            gh release edit "${TAG}" --draft=false --latest
          fi

  image-latest:
    name: Move the image tags 1.2 and latest
    needs: [version, release]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.version.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # All three images move together, and only forward: a fix for an older line (1.1.5 after 1.2.0) keeps 1.2 and
      # latest where they are, and moves 1.1 only when it is the newest of that line.
      - name: Move the tags
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          stable=$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          minor="${VERSION%.*}"
          newest=$(printf '%s\n' "${stable}" | tail -n 1)
          newest_of_minor=$(printf '%s\n' "${stable}" | grep -E "^${minor//./\\.}\.[0-9]+$" | tail -n 1)
          for image in tresso-api tresso-sync tresso-web; do
            tags=()
            [ "${VERSION}" = "${newest_of_minor}" ] && tags+=(-t "ghcr.io/${OWNER}/${image}:${minor}")
            [ "${VERSION}" = "${newest}" ] && tags+=(-t "ghcr.io/${OWNER}/${image}:latest")
            if [ "${#tags[@]}" -eq 0 ]; then
              echo "${VERSION} is not the newest release; ${image} keeps its tags."
              continue
            fi
            docker buildx imagetools create "${tags[@]}" "ghcr.io/${OWNER}/${image}:${VERSION}"
          done
