framework:
    rate_limiter:
        # Dynamic client registration (POST /oauth/register) per IPv4 address or IPv6 /64. Generous, because hosted
        # MCP clients register from a few shared addresses for all of their users; unused registrations are deleted
        # after 30 days.
        oauth_client_registration:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
            cache_pool: cache.rate_limiter_shared
        # Per IPv4 /24 or IPv6 /48 (a site), on top of the limit per sender.
        oauth_client_registration_network:
            policy: sliding_window
            limit: 200
            interval: '1 hour'
            cache_pool: cache.rate_limiter_shared
        # All registrations together, whatever the address: a ceiling for someone with many addresses.
        oauth_client_registration_global:
            policy: sliding_window
            limit: 5000
            interval: '1 hour'
            cache_pool: cache.rate_limiter_shared
        # Confirmation links for a notification address, per user (App\Notification\NotificationEmailAddress).
        notification_address_confirmation:
            policy: sliding_window
            limit: 5
            interval: '1 day'
            cache_pool: cache.rate_limiter_shared
        # The same links per receiving address, whoever asks for them.
        notification_address_confirmation_target:
            policy: sliding_window
            limit: 3
            interval: '1 day'
            cache_pool: cache.rate_limiter_shared
        # Checking a mail account's servers before connecting it (POST /api/v1/mail-account-checks), per user: each
        # check connects to a server the user named.
        mail_account_check:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
            cache_pool: cache.rate_limiter_shared
        # WhatsApp replies queued per user (App\Chat\ChatQueue), from every device and token together: far above a
        # person writing, low enough that a runaway client or tool cannot flood the user's chats from their number.
        chat_reply:
            policy: sliding_window
            limit: 100
            interval: '10 minutes'
            cache_pool: cache.rate_limiter_shared
        # WhatsApp searches (App\State\ChatSearchProcessor, POST /api/v1/chat-messages/search). Chat text is sealed, so
        # each search opens up to 2,000 messages: 30 searches in 10 minutes per caller (an app or a token of the user)
        # is far above a person or a tool paging through results, and 60 per user bounds every caller together, so a
        # loop cannot open a user's whole history over and over.
        chat_search_caller:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'
            cache_pool: cache.rate_limiter_shared
        chat_search:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'
            cache_pool: cache.rate_limiter_shared
        # WhatsApp replies queued per caller that is not one of our own apps (an app or a personal access token of the
        # user), on top of chat_reply: a tool sends far fewer than a person typing on their devices.
        chat_reply_caller:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
            cache_pool: cache.rate_limiter_shared
        chat_reply_caller_day:
            policy: sliding_window
            limit: 100
            interval: '1 day'
            cache_pool: cache.rate_limiter_shared
        # Batches a WhatsApp relay imports per chat account (App\State\ChatRelayProcessor). A first import of 30 days of
        # a busy WhatsApp is some tens of thousands of messages, 200 a batch: a burst of 1200 batches (240,000 messages)
        # takes it whole, and 2 batches a second after that are far above what arrives live. It stops a relay that
        # loops, not one that catches up.
        chat_relay_import:
            policy: token_bucket
            limit: 1200
            rate: { interval: '1 minute', amount: 120 }
            cache_pool: cache.rate_limiter_shared

when@dev: &redis_limits
    framework:
        cache:
            pools:
                # Shared by every API instance, so a limit holds across them.
                cache.rate_limiter_shared:
                    adapter: cache.adapter.redis
                    provider: '%env(REDIS_URL)%'

when@prod: *redis_limits

when@test:
    framework:
        rate_limiter:
            # Low enough for a test to reach, above the limit per sender (60).
            oauth_client_registration_network:
                policy: sliding_window
                limit: 65
                interval: '1 hour'
                cache_pool: cache.rate_limiter_shared
            oauth_client_registration_global:
                policy: sliding_window
                limit: 70
                interval: '1 hour'
                cache_pool: cache.rate_limiter_shared
            # Low enough for a test to reach; every test user is new, so no test inherits another's count.
            chat_reply:
                policy: sliding_window
                limit: 8
                interval: '10 minutes'
                cache_pool: cache.rate_limiter_shared
            # Low enough for a test to reach; every test user is new.
            chat_search_caller:
                policy: sliding_window
                limit: 8
                interval: '10 minutes'
                cache_pool: cache.rate_limiter_shared
            chat_search:
                policy: sliding_window
                limit: 12
                interval: '10 minutes'
                cache_pool: cache.rate_limiter_shared
            chat_reply_caller:
                policy: sliding_window
                limit: 4
                interval: '10 minutes'
                cache_pool: cache.rate_limiter_shared
            chat_reply_caller_day:
                policy: sliding_window
                limit: 6
                interval: '1 day'
                cache_pool: cache.rate_limiter_shared
            # Every test account is new; the limit test sends one batch more than this.
            chat_relay_import:
                policy: token_bucket
                limit: 30
                rate: { interval: '1 hour', amount: 1 }
                cache_pool: cache.rate_limiter_shared
        cache:
            pools:
                # Kept across requests (unlike an array, which is reset after every request), and apart from the
                # Redis of the running stack. Tests reset the limits they use.
                cache.rate_limiter_shared:
                    adapter: cache.adapter.filesystem
