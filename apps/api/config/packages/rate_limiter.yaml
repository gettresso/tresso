framework:
    rate_limiter:
        # Dynamic client registration (POST /oauth/register) per IPv4 address or IPv6 /64. Generous, because hosted
        # MCP clients register from a few shared addresses for all of their users; unused registrations are deleted
        # after 30 days.
        oauth_client_registration:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
            cache_pool: cache.rate_limiter_shared
        # Per IPv4 /24 or IPv6 /48 (a site), on top of the limit per sender.
        oauth_client_registration_network:
            policy: sliding_window
            limit: 200
            interval: '1 hour'
            cache_pool: cache.rate_limiter_shared
        # All registrations together, whatever the address: a ceiling for someone with many addresses.
        oauth_client_registration_global:
            policy: sliding_window
            limit: 5000
            interval: '1 hour'
            cache_pool: cache.rate_limiter_shared
        # Confirmation links for a notification address, per user (App\Notification\NotificationEmailAddress).
        notification_address_confirmation:
            policy: sliding_window
            limit: 5
            interval: '1 day'
            cache_pool: cache.rate_limiter_shared
        # The same links per receiving address, whoever asks for them.
        notification_address_confirmation_target:
            policy: sliding_window
            limit: 3
            interval: '1 day'
            cache_pool: cache.rate_limiter_shared
        # Checking a mail account's servers before connecting it (POST /api/v1/mail-account-checks), per user: each
        # check connects to a server the user named.
        mail_account_check:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
            cache_pool: cache.rate_limiter_shared

when@dev: &redis_limits
    framework:
        cache:
            pools:
                # Shared by every API instance, so a limit holds across them.
                cache.rate_limiter_shared:
                    adapter: cache.adapter.redis
                    provider: '%env(REDIS_URL)%'

when@prod: *redis_limits

when@test:
    framework:
        rate_limiter:
            # Low enough for a test to reach, above the limit per sender (60).
            oauth_client_registration_network:
                policy: sliding_window
                limit: 65
                interval: '1 hour'
                cache_pool: cache.rate_limiter_shared
            oauth_client_registration_global:
                policy: sliding_window
                limit: 70
                interval: '1 hour'
                cache_pool: cache.rate_limiter_shared
        cache:
            pools:
                # Kept across requests (unlike an array, which is reset after every request), and apart from the
                # Redis of the running stack. Tests reset the limits they use.
                cache.rate_limiter_shared:
                    adapter: cache.adapter.filesystem
