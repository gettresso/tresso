security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        health:
            pattern: ^/health$
            security: false
        # The token endpoint and token revocation (RFC 7009): clients identify themselves in the request.
        oauth_token:
            pattern: ^/oauth/(token|revoke)$
            security: false
        # Apps that are not ours register themselves here (RFC 7591); limited per IP address in the controller.
        oauth_register:
            pattern: ^/oauth/register$
            security: false
        # Authorization server and protected resource metadata (RFC 8414, RFC 9728): public documents.
        oauth_metadata:
            pattern: ^/\.well-known/oauth-
            security: false
        # Stripe signs its webhook; the controller checks that signature instead of a session or token.
        stripe_webhook:
            pattern: ^/billing/stripe/webhook$
            security: false
        # Attachment content behind signed, expiring URLs (rendered mail cannot send access tokens).
        content:
            pattern: ^/content/
            security: false
        # Bearer tokens issued by our own OAuth2 server (clients, sync workers, third parties) and personal access
        # tokens (`tresso_pat_...`), which the OAuth2 authenticator leaves alone.
        api:
            pattern: ^/(api|internal)/
            stateless: true
            oauth2: true
            custom_authenticators:
                - App\Security\PersonalAccessToken\PersonalAccessTokenAuthenticator
        # The MCP endpoint: the same tokens as the API. A request without a valid token gets a 401 that points to the
        # protected resource metadata of /mcp (App\Mcp\Security\McpAuthenticationChallenge).
        mcp:
            pattern: ^/mcp$
            stateless: true
            oauth2: true
            custom_authenticators:
                - App\Security\PersonalAccessToken\PersonalAccessTokenAuthenticator
        # Browser session used only to sign in and approve OAuth2 authorization requests (with the consent screen for
        # apps that are not ours).
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            # Five wrong passwords for one address from one network address, or 25 from one network address, lock the
            # form for 15 minutes. In Redis (cache.rate_limiter_shared), so the limit holds across API instances.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
                cache_pool: cache.rate_limiter_shared
            # "Keep me signed in" (on by default on the sign-in form): the browser signs in again from this cookie for
            # 30 days after the session ended, as long as the refresh tokens of our apps. A new password ends it.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                secure: auto
                httponly: true
                samesite: lax
                signature_properties: ['password']
            # Only a POST from Tresso gets here (App\Security\SignOutGuard); it ends the session and the cookie above.
            logout:
                path: app_logout
                target: '%env(WEB_APP_URL)%'

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/authorize, roles: ROLE_USER }
        # Google and Microsoft redirect here after a sign-in. It only passes their answer on to the web app, which
        # finishes with its access token (ProviderConnector); the browser session lives too short to rely on here.
        - { path: ^/connect/, roles: PUBLIC_ACCESS }
        - { path: ^/internal/, roles: IS_AUTHENTICATED_FULLY }
        # A user's token (personal access token, our own apps or an app they allowed); never a sync worker's.
        - { path: ^/mcp$, roles: MCP_USER }
        # What this server is: open before sign-in.
        - { path: ^/api/v1/server-info$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
