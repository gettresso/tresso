nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(cors_origins:CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        # What an OAuth2 or MCP client running in a browser (such as the MCP Inspector) needs before it has a token:
        # the metadata, registering itself and the token exchange, and revoking its tokens again. Open to every origin,
        # never with cookies.
        '^/(\.well-known/oauth-|oauth/(register|token|revoke)$)':
            origin_regex: false
            allow_origin: ['*']
            allow_methods: ['GET', 'POST', 'OPTIONS']
            allow_headers: ['Content-Type', 'Authorization', 'MCP-Protocol-Version']
            allow_credentials: false
            max_age: 3600
        '^/': null
