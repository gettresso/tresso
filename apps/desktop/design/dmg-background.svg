<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFBFD"/>
      <stop offset="1" stop-color="#ECEFF6"/>
    </linearGradient>
    <radialGradient id="glowDo"><stop offset="0" stop-color="#2341D6" stop-opacity="0.10"/><stop offset="1" stop-color="#2341D6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowHand"><stop offset="0" stop-color="#E0701B" stop-opacity="0.10"/><stop offset="1" stop-color="#E0701B" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowKnow"><stop offset="0" stop-color="#2F9C86" stop-opacity="0.10"/><stop offset="1" stop-color="#2F9C86" stop-opacity="0"/></radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2341D6"/>
      <stop offset="0.5" stop-color="#E0701B"/>
      <stop offset="1" stop-color="#2F9C86"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="4.2" markerHeight="4.2" markerUnits="strokeWidth" orient="auto">
      <path d="M 1.5 1.5 L 9.5 6 L 1.5 10.5" fill="none" stroke="#2F9C86" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#16181D" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#dots)"/>
  <circle cx="150" cy="220" r="190" fill="url(#glowDo)"/>
  <circle cx="330" cy="120" r="170" fill="url(#glowHand)"/>
  <circle cx="510" cy="230" r="190" fill="url(#glowKnow)"/>

  <text x="330" y="70" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#16181D">Drag Tresso to Applications</text>
  <text x="330" y="96" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6B7280">Then open it from Launchpad or Spotlight.</text>

  <!-- From the app (centered at 180,200) to Applications (480,200), arcing above the icon labels. -->
  <path d="M 258 186 C 296 140, 364 140, 400 186" fill="none" stroke="url(#arrow)" stroke-width="3.5" stroke-linecap="round" marker-end="url(#head)"/>

  <text x="330" y="368" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8A92A0">Every email is something to do, to hand over, or to know.</text>
</svg>
