[package]
name = "tresso-desktop"
version = "0.1.0"
description = "Desktop client"
license = "AGPL-3.0-only"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tresso_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api: the see-through window behind the vibrancy in tauri.macos.conf.json (no effect elsewhere).
tauri = { version = "2.12.4", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-notification = "2.7.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
# The keychain (tokens.rs): keyring's store crates directly, so a store that failed to open is tried again.
keyring-core = "1.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# WhatsApp (whatsapp.rs): the folder and file pickers, plain HTTP to the bridge on 127.0.0.1 (no TLS stack), the
# SHA-256 check of a downloaded file, and the bridge's token from the OS's random source.
tauri-plugin-dialog = "2.8.4"
ureq = { version = "3.5.2", default-features = false }
sha2 = "0.10.9"
getrandom = "0.3.4"

[dev-dependencies]
# The mock runtime and IPC helpers, for the menu_state test (menu.rs); tests only.
tauri = { version = "2.12.4", features = ["macos-private-api", "test"] }

# Reads the "Reduce transparency" setting, so the web glass turns solid with the window's vibrancy, and the selection
# colour that follows the user's accent colour (accessibility.rs), and adds the Edit menu's items Tauri has none for and
# keeps the main window out of AppKit's window list (menu.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSAccessibility", "NSAppearance", "NSColor", "NSColorSpace", "NSWorkspace", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }
# Loads and drives Sparkle, the macOS updater (updates.rs).
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSString"] }
# The keychain each platform keeps the sign-in in (tokens.rs).
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

# Stops the WhatsApp bridge with SIGTERM first, and finds a bridge a crashed run left behind (whatsapp.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
# Not used directly: rust-ini 0.21.2 added fields to `ParseOption`, which tauri-plugin-deep-link 2.6.2 builds without
# them on Linux, so it no longer compiles there. Drop this pin once the plugin sets the new fields.
rust-ini = "=0.21.1"
