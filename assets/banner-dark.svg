  <text x="72" y="226" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#B5BBC6">Every email is something to do, to hand over, or to know.</text>
